<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Candlestick Analyzer Bangla</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: #090514;
      color: #e0e0e0;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Particle Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    /* CYBERPUNK / GLOWING LOCK SCREEN (Yellow Theme) */
    #lockScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #1a1600 0%, #080600 100%);
      backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lock-box {
      background: rgba(20, 16, 0, 0.7);
      border: 2px solid #ffcc00;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 20px #ffcc00, 0 0 40px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.2);
      max-width: 380px;
      width: 90%;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px #ffcc00, 0 0 30px rgba(255, 204, 0, 0.3); }
      100% { box-shadow: 0 0 30px #ffcc00, 0 0 60px rgba(255, 204, 0, 0.6); }
    }

    .lock-box h2 {
      color: #ffcc00;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 0 10px #ffcc00;
      letter-spacing: 1px;
    }

    .lock-box p.owner-text {
      color: #ffd700;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
    }

    .lock-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ffcc00;
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc00;
      text-align: center;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.2);
      transition: 0.3s;
    }

    .lock-box input:focus {
      border-color: #fff;
      box-shadow: 0 0 15px #ffcc00;
    }

    .lock-box button {
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      color: #000;
      font-weight: 800;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
      transition: 0.3s;
    }

    .lock-box button:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px #ffcc00;
    }

    /* MAIN APP CONTAINER */
    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h2.title {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, #b06ab3, #4568dc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CUSTOM UPLOAD BOX */
    .upload-card {
      border: 2px dashed #2b3a67;
      border-radius: 20px;
      background: rgba(13, 18, 38, 0.7);
      backdrop-filter: blur(10px);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-card:hover {
      border-color: #4b6cb7;
      background: rgba(20, 28, 58, 0.8);
      box-shadow: 0 0 20px rgba(75, 108, 183, 0.3);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .upload-text {
      color: #a0aec0;
      font-size: 16px;
      font-style: italic;
      font-weight: 500;
    }

    #imageInput {
      display: none;
    }

    /* CUSTOM ANALYZE BUTTON */
    .btn-analyze {
      width: 100%;
      margin-top: 25px;
      background: linear-gradient(135deg, #4a77d4, #6b43d6);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      box-shadow: 0 6px 20px rgba(107, 67, 214, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-analyze:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(107, 67, 214, 0.6);
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* SIGNAL RESULT BOXES */
    #signalBox {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }

    .signal-up { background: #00c853; color: #fff; box-shadow: 0 0 25px rgba(0, 200, 83, 0.5) !important; }
    .signal-down { background: #ff1744; color: #fff; box-shadow: 0 0 25px rgba(255, 23, 68, 0.5) !important; }
    .signal-skip { background: #ff9100; color: #000; box-shadow: 0 0 25px rgba(255, 145, 0, 0.5) !important; }

    #detailsBox {
      display: none;
      margin-top: 15px;
      text-align: left;
      background: rgba(20, 10, 35, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      padding: 25px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.8;
      color: #d1d5db;
      font-size: 15px;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center; align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #130a21;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 30px;
      border-radius: 14px;
      width: 90%; max-width: 400px;
    }

    .modal-content input {
      width: 100%; padding: 12px; margin: 15px 0;
      border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #090514; color: #fff; outline: none;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔒 SYSTEM LOCKED</h2>
      <p class="owner-text">System owner 'SAFWAN'</p>
      <input type="password" id="passInput" placeholder="Enter Access Code">
      <button onclick="checkPassword()">UNLOCK</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h2 class="title">📊 AI ক্যান্ডেলস্টিক চার্ট এনালাইজার</h2>
      <button class="settings-btn" onclick="openSettings()">⚙️ সেটিং</button>
    </div>

    <!-- NEW CUSTOM UPLOAD CARD -->
    <div class="upload-card" onclick="document.getElementById('imageInput').click()">
      <div class="icon-box">📈</div>
      <p class="upload-text" id="uploadText">Tap to Select Chart Screenshot</p>
      <input type="file" id="imageInput" accept="image/*" onchange="fileSelected(this)">
    </div>

    <!-- NEW CUSTOM BUTTON -->
    <button class="btn-analyze" onclick="uploadAndAnalyze()">
      ANALYZE SIGNAL ⚡
    </button>

    <div id="signalBox"></div>

    <div id="detailsBox">চার্টের ছবি সিলেক্ট করে "ANALYZE SIGNAL ⚡" বাটনে ক্লিক করুন...</div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>⚙️ API Key সেটিং</h3>
      <p style="font-size: 13px; color: #aaa; margin-top: 5px;">আপনার কাস্টম Gemini API Key নিচে দিন:</p>
      <input type="password" id="customApiKey" placeholder="Gemini API Key পেস্ট করুন">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="settings-btn" onclick="closeSettings()">বাতিল</button>
        <button class="btn-analyze" onclick="saveSettings()" style="padding: 8px 16px; margin-top:0; font-size: 14px;">সেভ করুন</button>
      </div>
    </div>
  </div>

  <script>
    // 1. LOCK SYSTEM
    function checkPassword() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'lawlite50') {
        document.getElementById('lockScreen').style.display = 'none';
      } else {
        alert('ভুল পাসওয়ার্ড!');
      }
    }

    // 2. FILE SELECTION UPDATE
    function fileSelected(input) {
      const textElem = document.getElementById('uploadText');
      if (input.files && input.files[0]) {
        textElem.innerText = "Selected: " + input.files[0].name;
        textElem.style.color = "#00ffff";
      } else {
        textElem.innerText = "Tap to Select Chart Screenshot";
        textElem.style.color = "#a0aec0";
      }
    }

    // 3. SETTINGS MANAGEMENT
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('user_gemini_api_key');
      if (savedKey) document.getElementById('customApiKey').value = savedKey;
    });

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      const key = document.getElementById('customApiKey').value.trim();
      if (key) {
        localStorage.setItem('user_gemini_api_key', key);
        alert('API Key সেভ হয়েছে!');
      } else {
        localStorage.removeItem('user_gemini_api_key');
        alert('ডিফল্ট API Key রিস্টোর করা হয়েছে।');
      }
      closeSettings();
    }

    // 4. CHART ANALYSIS
    async function uploadAndAnalyze() {
      const fileInput = document.getElementById('imageInput');
      const signalBox = document.getElementById('signalBox');
      const detailsBox = document.getElementById('detailsBox');
      const customApiKey = localStorage.getItem('user_gemini_api_key') || '';

      if (!fileInput.files[0]) {
        alert('অনুগ্রহ করে একটি ছবি আগে সিলেক্ট করুন!');
        return;
      }

      signalBox.style.display = 'none';
      detailsBox.style.display = 'block';
      detailsBox.innerText = 'Gemini AI চার্ট এনালাইসিস করছে... অনুগ্রহ করে অপেক্ষা করুন...';

      const formData = new FormData();
      formData.append('chart', fileInput.files[0]);

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'x-api-key': customApiKey },
          body: formData
        });
        const data = await res.json();
        
        if (data.error) {
          detailsBox.innerText = data.error;
          return;
        }

        const text = data.analysis;
        
        // Signal Parsing
        let signal = 'SKIP';
        let signalClass = 'signal-skip';

        if (text.includes('RECOMMENDATION: UP')) {
          signal = '🟢 পরবর্তী ক্যান্ডেল: UP (BUY)';
          signalClass = 'signal-up';
        } else if (text.includes('RECOMMENDATION: DOWN')) {
          signal = '🔴 পরবর্তী ক্যান্ডেল: DOWN (SELL)';
          signalClass = 'signal-down';
        } else {
          signal = '🟠 পরবর্তী ক্যান্ডেল: SKIP (মার্কেট অনিশ্চিত)';
          signalClass = 'signal-skip';
        }

        // Show Signal Box
        signalBox.className = '';
        signalBox.classList.add(signalClass);
        signalBox.innerText = signal;
        signalBox.style.display = 'block';

        // Show Details
        detailsBox.innerText = text;

      } catch (err) {
        detailsBox.innerText = 'সার্ভারের সাথে সংযোগ স্থাপন করতে সমস্যা হচ্ছে।';
      }
    }

    // 5. ANIMATED BACKGROUND
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 70; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.8
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(168, 85, 247, 0.6)';

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
