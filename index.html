<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Candlestick Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: #090514;
      color: #e0e0e0;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    /* LOCK SCREEN (Yellow Theme) */
    #lockScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 12, 5, 0.95);
      backdrop-filter: blur(15px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .lock-box {
      background: rgba(255, 204, 0, 0.05);
      border: 1px solid rgba(255, 204, 0, 0.3);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
      max-width: 350px;
      width: 90%;
    }

    .lock-box h2 {
      color: #ffcc00;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ffcc00;
      background: #1a1600;
      color: #fff;
      text-align: center;
      font-size: 16px;
      outline: none;
    }

    .lock-box button {
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .lock-box button:hover { background: #e6b800; }

    /* MAIN APP (Purple Theme) */
    .container {
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h2.title {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #b06ab3, #4568dc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .box {
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 35px 20px;
      border-radius: 16px;
      background: rgba(20, 10, 35, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(112, 0, 255, 0.2);
      text-align: center;
    }

    input[type="file"] { margin: 20px 0; color: #aaa; }

    .btn-main {
      background: linear-gradient(135deg, #8a2be2, #4a00e0);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: 0.3s;
    }

    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6); }

    .settings-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* SIGNAL RESULT BOXES */
    #signalBox {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .signal-up { background: #00c853; color: #fff; box-shadow: 0 0 20px rgba(0, 200, 83, 0.4) !important; }
    .signal-down { background: #ff1744; color: #fff; box-shadow: 0 0 20px rgba(255, 23, 68, 0.4) !important; }
    .signal-skip { background: #ff9100; color: #000; box-shadow: 0 0 20px rgba(255, 145, 0, 0.4) !important; }

    #detailsBox {
      display: none;
      margin-top: 15px;
      text-align: left;
      background: rgba(20, 10, 35, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      padding: 25px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.7;
      color: #d1d5db;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center; align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #130a21;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 30px;
      border-radius: 14px;
      width: 90%; max-width: 400px;
    }

    .modal-content input {
      width: 100%; padding: 12px; margin: 15px 0;
      border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #090514; color: #fff; outline: none;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔒 System Locked</h2>
      <input type="password" id="passInput" placeholder="Enter Access Code">
      <button onclick="checkPassword()">UNLOCK</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h2 class="title">📊 AI Candlestick Analyzer</h2>
      <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="box">
      <input type="file" id="imageInput" accept="image/*">
      <br>
      <button class="btn-main" onclick="uploadAndAnalyze()">Analyze Chart</button>
    </div>

    <div id="signalBox"></div>

    <div id="detailsBox">Upload an image and click analyze...</div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>⚙️ API Key Settings</h3>
      <p style="font-size: 13px; color: #aaa; margin-top: 5px;">Set your custom Gemini API Key.</p>
      <input type="password" id="customApiKey" placeholder="Paste Gemini API Key">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="settings-btn" onclick="closeSettings()">Cancel</button>
        <button class="btn-main" onclick="saveSettings()" style="padding: 8px 16px;">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    // 1. LOCK SYSTEM
    function checkPassword() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'lawlite50') {
        document.getElementById('lockScreen').style.display = 'none';
      } else {
        alert('Wrong Password!');
      }
    }

    // 2. SETTINGS MANAGEMENT
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('user_gemini_api_key');
      if (savedKey) document.getElementById('customApiKey').value = savedKey;
    });

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      const key = document.getElementById('customApiKey').value.trim();
      if (key) {
        localStorage.setItem('user_gemini_api_key', key);
        alert('API Key saved!');
      } else {
        localStorage.removeItem('user_gemini_api_key');
        alert('Default API Key restored.');
      }
      closeSettings();
    }

    // 3. CHART ANALYSIS & SIGNAL PARSING
    async function uploadAndAnalyze() {
      const fileInput = document.getElementById('imageInput');
      const signalBox = document.getElementById('signalBox');
      const detailsBox = document.getElementById('detailsBox');
      const customApiKey = localStorage.getItem('user_gemini_api_key') || '';

      if (!fileInput.files[0]) {
        alert('Please select an image first!');
        return;
      }

      signalBox.style.display = 'none';
      detailsBox.style.display = 'block';
      detailsBox.innerText = 'Analyzing chart with Gemini AI... Please wait...';

      const formData = new FormData();
      formData.append('chart', fileInput.files[0]);

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'x-api-key': customApiKey },
          body: formData
        });
        const data = await res.json();
        
        if (data.error) {
          detailsBox.innerText = data.error;
          return;
        }

        const text = data.analysis;
        
        // Signal Detection Logic
        let signal = 'SKIP';
        let signalClass = 'signal-skip';

        if (text.includes('RECOMMENDATION: UP') || text.includes('PREDICTION: UP')) {
          signal = '🟢 NEXT CANDLE: UP';
          signalClass = 'signal-up';
        } else if (text.includes('RECOMMENDATION: DOWN') || text.includes('PREDICTION: DOWN')) {
          signal = '🔴 NEXT CANDLE: DOWN';
          signalClass = 'signal-down';
        } else {
          signal = '🟠 NEXT CANDLE: SKIP / UNCERTAIN';
          signalClass = 'signal-skip';
        }

        // Show Signal Box
        signalBox.className = '';
        signalBox.classList.add(signalClass);
        signalBox.innerText = signal;
        signalBox.style.display = 'block';

        // Show Details
        detailsBox.innerText = text;

      } catch (err) {
        detailsBox.innerText = 'Error connecting to server.';
      }
    }

    // 4. ANIMATED SPACE BACKGROUND (PARTICLES)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 70; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.8
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(168, 85, 247, 0.6)';

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
