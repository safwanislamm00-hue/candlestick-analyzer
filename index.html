<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candlestick Chart AI Analyzer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1a1a3a 0%, #0d0d15 60%, #050508 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #8a2be2, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .box {
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      transition: border 0.3s ease;
    }

    .box:hover {
      border-color: rgba(0, 255, 255, 0.3);
    }

    input[type="file"] {
      margin: 20px 0;
      color: #aaa;
    }

    button {
      background: linear-gradient(135deg, #007bff, #6610f2);
      color: #fff;
      border: none;
      padding: 12px 26px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    #result {
      margin-top: 30px;
      text-align: left;
      background: rgba(20, 20, 35, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 25px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 15px;
      color: #d1d5db;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #12121e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 14px;
      width: 90%;
      max-width: 420px;
      text-align: left;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #09090f;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }

    .modal-content input:focus {
      border-color: #00ffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📊 AI Candlestick Analyzer</h2>
      <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="box">
      <input type="file" id="imageInput" accept="image/*">
      <br>
      <button onclick="uploadAndAnalyze()">Analyze Chart</button>
    </div>

    <div id="result">Upload an image and click analyze...</div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 8px;">⚙️ API Key Settings</h3>
      <p style="font-size: 13px; color: #888;">আপনার কাস্টম Gemini API Key সেট করুন।</p>
      <input type="password" id="customApiKey" placeholder="Paste your Gemini API Key here">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="settings-btn" onclick="closeSettings()">Cancel</button>
        <button onclick="saveSettings()">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('user_gemini_api_key');
      if (savedKey) document.getElementById('customApiKey').value = savedKey;
    });

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      const key = document.getElementById('customApiKey').value.trim();
      if (key) {
        localStorage.setItem('user_gemini_api_key', key);
        alert('API Key saved successfully!');
      } else {
        localStorage.removeItem('user_gemini_api_key');
        alert('Cleared custom API Key. Default key will be used.');
      }
      closeSettings();
    }

    async function uploadAndAnalyze() {
      const fileInput = document.getElementById('imageInput');
      const resultDiv = document.getElementById('result');
      const customApiKey = localStorage.getItem('user_gemini_api_key') || '';

      if (!fileInput.files[0]) {
        alert('Please select an image first!');
        return;
      }

      resultDiv.innerText = 'Analyzing chart with Gemini AI... Please wait...';

      const formData = new FormData();
      formData.append('chart', fileInput.files[0]);

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'x-api-key': customApiKey },
          body: formData
        });
        const data = await res.json();
        resultDiv.innerText = data.analysis || data.error;
      } catch (err) {
        resultDiv.innerText = 'Error connecting to server.';
      }
    }
  </script>
</body>
</html>
